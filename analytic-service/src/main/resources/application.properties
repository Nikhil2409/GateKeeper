spring.application.name=analytic-service
server.port=8082

info.app.name=Analytic Service
info.app.description=Traffic analytics for the platform and tenant dashboards.

spring.threads.virtual.enabled=true

# Own database: MongoDB 7.0+ (the queries use $percentile). Indexes, incl. the 15-day TTL, are created on startup
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gatekeeper_analytics}
spring.data.mongodb.auto-index-creation=true

# Users log in through api-management-service; their JWT is verified with its public keys (decision #25)
analytics.security.jwks-uri=${MANAGEMENT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
analytics.security.issuer=gatekeeper-api-management
analytics.security.cors.allowed-origins=http://localhost:5175

# Topics this service reads (Kafka in the last step)
analytics.kafka.traffic-events-topic=gateway.traffic-events
analytics.kafka.org-config-topic=gateway.org-config
