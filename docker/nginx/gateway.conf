# The only public entry to the gateways: round-robin over the three instances.
# Only an instance that can't be reached (connection refused or timed out) is retried on the next and taken out for
# a few seconds - for idempotent methods only (nginx never retries POST/PATCH). A 502/503 FROM a gateway is about a
# tenant's route (circuit open, upstream down, Redis down) and goes back to the caller as it is: counting those as
# instance failures took all three instances out under load (decision #71).
upstream gateways {
    server smart-gateway-1:8080 max_fails=3 fail_timeout=5s;
    server smart-gateway-2:8080 max_fails=3 fail_timeout=5s;
    server smart-gateway-3:8080 max_fails=3 fail_timeout=5s;
    keepalive 64;
}

server {
    listen 8080;
    client_max_body_size 2m;

    location / {
        proxy_pass http://gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 500ms;
        proxy_read_timeout 65s;
    }
}
