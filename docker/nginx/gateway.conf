# The only public entry to the gateways: round-robin over the three instances.
# A request that fails on one instance (connection error, timeout, 502/503) is retried on the next, but only for
# idempotent methods (nginx never retries POST/PATCH by default), so a stopped instance costs no GETs.
upstream gateways {
    server smart-gateway-1:8080 max_fails=3 fail_timeout=5s;
    server smart-gateway-2:8080 max_fails=3 fail_timeout=5s;
    server smart-gateway-3:8080 max_fails=3 fail_timeout=5s;
    keepalive 64;
}

server {
    listen 8080;
    client_max_body_size 2m;

    location / {
        proxy_pass http://gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 65s;
    }
}
