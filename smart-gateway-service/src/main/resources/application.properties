spring.application.name=smart-gateway-service
server.port=8080

info.app.name=Smart Gateway Service
info.app.description=Custom api gateway to process and forward live traffic.

# Blocking code on virtual threads: simple to read, scales to many concurrent upstream calls
spring.threads.virtual.enabled=true

# Identifies this instance in /_gateway/status (several instances run behind a load balancer)
gateway.instance-id=${GATEWAY_INSTANCE_ID:${COMPUTERNAME:${HOSTNAME:smart-gateway}}}

# The gateway never touches the database or calls api-management: configuration arrives over Kafka (last step)

# api-management-ui reads /_gateway/health and /_gateway/status from the browser (platform overview)
gateway.cors.allowed-origins=http://localhost:5173

# Request bodies are forwarded as they are; Spring must not parse form bodies on the way
spring.mvc.formcontent.filter.enabled=false
gateway.request.max-body-bytes=1048576

# Hosts a route may never reach (same list as api-management); 169.254.x (cloud metadata) is always blocked
gateway.upstream.blocked-hosts=api-management-service,smart-gateway-service,analytic-service,mysql,redis,kafka,metadata.google.internal
gateway.upstream.allow-loopback=${UPSTREAM_ALLOW_LOOPBACK:false}
gateway.upstream.connect-timeout-ms=2000

# Redis: rate-limit/quota counters and idempotency records, shared by all gateway instances.
# Short timeouts so a slow or down Redis can't stall traffic (limits then fail open, idempotency fails closed)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# How long a completed idempotent response is replayed, and the largest one that is stored
gateway.idempotency.ttl=24h
gateway.idempotency.max-response-bytes=1048576

# One event per tenant request for analytic-service (Kafka in the last step; logged until then)
gateway.traffic-events.topic=gateway.traffic-events
