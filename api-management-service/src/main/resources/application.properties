spring.application.name=api-management-service
server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper_mgmt
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.platform_admin_username=${PLATFORM_ADMIN_USERNAME:platform-admin}
spring.flyway.placeholders.platform_admin_password_hash=${PLATFORM_ADMIN_PASSWORD_HASH}
# Still needed by V2 on a fresh database; that gateway account is removed again by V5 and can never log in
spring.flyway.placeholders.gateway_client_username=smart-gateway
spring.flyway.placeholders.gateway_client_password_hash=disabled

gatekeeper.security.jwt.issuer=gatekeeper-api-management
gatekeeper.security.jwt.access-token-ttl=15m
gatekeeper.security.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION:classpath:certs/public.pem}
gatekeeper.security.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION:classpath:certs/private.pem}

# Correlation id on every log line ([-] outside a request)
logging.pattern.correlation=[%X{correlationId:-}] 

# api-management-ui and analytics-ui (both log in through this service)
gatekeeper.security.cors.allowed-origins=http://localhost:5173,http://localhost:5175

# Configuration published for the gateways: compacted topic, created on startup if missing (OrgConfigTopic)
gatekeeper.gateway-config.topic=gateway.org-config
gatekeeper.kafka.partitions=3
gatekeeper.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}

# Rollback history: tenants can roll back to one of their organization's last N configuration versions
gatekeeper.config-history.max-versions=5

# Hosts a tenant route may never target (the platform's own services); 169.254.x (cloud metadata) is always blocked
gatekeeper.routes.blocked-hosts=api-management-service,smart-gateway-service,analytic-service,mysql,redis,kafka,metadata.google.internal
# Loopback targets (localhost, 127.x) are refused unless explicitly allowed, e.g. for local development
gatekeeper.routes.allow-loopback=${ROUTES_ALLOW_LOOPBACK:false}

# Kafka broker (docker-compose.yml); /health reports whether it answers
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Configuration must never be lost or duplicated by retries. Changes are sent on the request thread right after
# commit, so a send waits at most 2 s for Kafka (default 60 s); a failed send is healed by the next startup publish.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
