spring.application.name=api-management-service
server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper_mgmt
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.platform_admin_username=${PLATFORM_ADMIN_USERNAME:platform-admin}
spring.flyway.placeholders.platform_admin_password_hash=${PLATFORM_ADMIN_PASSWORD_HASH}
spring.flyway.placeholders.gateway_client_username=${GATEWAY_CLIENT_USERNAME:smart-gateway}
spring.flyway.placeholders.gateway_client_password_hash=${GATEWAY_CLIENT_PASSWORD_HASH}

gatekeeper.security.jwt.issuer=gatekeeper-api-management
gatekeeper.security.jwt.access-token-ttl=15m
gatekeeper.security.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION:classpath:certs/public.pem}
gatekeeper.security.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION:classpath:certs/private.pem}

gatekeeper.security.cors.allowed-origins=http://localhost:5173

# Hosts a tenant route may never target (the platform's own services); 169.254.x (cloud metadata) is always blocked
gatekeeper.routes.blocked-hosts=api-management-service,smart-gateway-service,analytic-service,mysql,redis,kafka,metadata.google.internal
# Loopback targets (localhost, 127.x) are refused unless explicitly allowed, e.g. for local development
gatekeeper.routes.allow-loopback=${ROUTES_ALLOW_LOOPBACK:false}
